name: Download product photos

on:
  push:
    branches: [main]
    paths:
      - photos_manifest.csv
      - scripts/download_photos.py
      - .github/workflows/download-photos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-photos
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pillow

      - name: Download photos
        run: python scripts/download_photos.py

      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add photos photos_report.csv
          if git diff --cached --quiet; then
            echo "No new photos to commit"
          else
            git commit -m "Add product photos ($(grep -c ',ok,' photos_report.csv) downloaded)"
            git push
          fi
