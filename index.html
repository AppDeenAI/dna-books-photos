<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA Lifestyle — Books Photos</title>
<meta name="description" content="Photos, descriptions and Shopify import files for the DNA Lifestyle books and stationery catalogue.">
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e5e3df;
    --text: #1c1c1a;
    --muted: #55534e;
    --accent: #b5651d;
    --chip: #efede9;
    --warn-bg: #fdecea;
    --warn-text: #8a2b1d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171715;
      --card: #211f1c;
      --border: #332f2a;
      --text: #ffffff;
      --muted: #ffffff;
      --accent: #e0995a;
      --chip: #2c2925;
      --warn-bg: #4a2620;
      --warn-text: #ffffff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171715;
    --card: #211f1c;
    --border: #332f2a;
    --text: #ffffff;
    --muted: #ffffff;
    --accent: #e0995a;
    --chip: #2c2925;
    --warn-bg: #4a2620;
    --warn-text: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  a { color: var(--accent); }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 12px;
  }
  .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
  header h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  header p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; }
  .links a { text-decoration: none; font-weight: 600; }
  .links a:hover { text-decoration: underline; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #search {
    flex: 1 1 260px;
    max-width: 420px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters button {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 11px;
    font-size: 12px;
    cursor: pointer;
  }
  .filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #count { font-size: 12px; color: var(--muted); margin-top: 8px; }
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    text-align: left;
    padding: 0;
    color: inherit;
    font: inherit;
  }
  .card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
  .photos { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: #fff; }
  .photos img {
    flex: 0 0 100%;
    scroll-snap-align: start;
    width: 100%;
    height: 180px;
    object-fit: contain;
    background: #fff;
    display: block;
  }
  .nophoto {
    flex: 0 0 100%;
    height: 180px; display: flex; align-items: center; justify-content: center;
    background: var(--chip); color: var(--muted); font-size: 12px;
  }
  .photos::-webkit-scrollbar { height: 5px; }
  .photos::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .meta { padding: 10px 12px 12px; }
  .pid { font-size: 11px; color: var(--accent); font-weight: 600; letter-spacing: 0.02em; }
  .name { font-size: 13px; font-weight: 500; margin: 2px 0 4px; line-height: 1.3; }
  .sub { font-size: 11px; color: var(--muted); line-height: 1.4; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag { font-size: 10px; padding: 2px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .tag.warn { background: var(--warn-bg); color: var(--warn-text); }
  .hidden { display: none !important; }
  #empty { text-align: center; color: var(--muted); padding: 60px 16px; font-size: 14px; }
  #sentinel { height: 1px; }

  dialog {
    width: min(920px, calc(100vw - 24px));
    max-height: calc(100vh - 24px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0;
    background: var(--card);
    color: var(--text);
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  .dhead { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--card); }
  .dhead h2 { margin: 0; font-size: 16px; line-height: 1.35; }
  .close { border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; height: fit-content; }
  .dbody { padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 18px; }
  .big { display: flex; flex-direction: column; gap: 10px; }
  .big a { display: block; background: #fff; border: 1px solid var(--border); border-radius: 8px; }
  .big img { width: 100%; max-height: 460px; object-fit: contain; display: block; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin: 0 0 12px; }
  .facts dt { color: var(--muted); font-weight: 600; }
  .facts dd { margin: 0; }
  .desc { font-size: 14px; line-height: 1.55; }
  .desc ul { padding-left: 18px; }
  .note { font-size: 12px; background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
  @media (max-width: 700px) {
    header { position: static; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .photos img, .nophoto { height: 150px; }
    .dbody { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>DNA Lifestyle — Books &amp; Stationery Photos</h1>
      <p id="lede">Loading catalogue…</p>
    </div>
    <nav class="links">
      <a href="Books_Shopify_Import.csv" download>Shopify import CSV</a>
      <a href="Books_Shopify_Review.xlsx" download>Review workbook</a>
      <a href="https://github.com/AppDeenAI/dna-books-photos">GitHub repo</a>
    </nav>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title, author, SKU or barcode…" autocomplete="off" aria-label="Search">
    <div class="filters" role="group" aria-label="Filter">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="books" aria-pressed="false">Books</button>
      <button data-f="stationery" aria-pressed="false">Stationery</button>
      <button data-f="attention" aria-pressed="false">Needs check</button>
      <button data-f="nophoto" aria-pressed="false">No photo</button>
    </div>
  </div>
  <div id="count"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div id="sentinel"></div>
  <div id="empty" class="hidden">No matches.</div>
</main>

<dialog id="dlg" aria-labelledby="dtitle">
  <div class="dhead">
    <h2 id="dtitle" dir="auto"></h2>
    <button class="close" id="dclose">Close</button>
  </div>
  <div class="dbody">
    <div class="big" id="dphotos"></div>
    <div>
      <div id="dnote"></div>
      <dl class="facts" id="dfacts"></dl>
      <div class="desc" id="ddesc"></div>
    </div>
  </div>
</dialog>

<script>
let DATA = [], LIST = [], shown = 0, filterKey = 'all';
const PAGE = 120;
const $ = id => document.getElementById(id);
const grid = $('grid'), countEl = $('count'), emptyEl = $('empty'), searchEl = $('search');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function cardHTML(p, i) {
  const imgs = p.photos.length
    ? p.photos.map(ph => `<img src="${esc(ph.thumb)}" loading="lazy" alt="${esc(p.title)}">`).join('')
    : '<div class="nophoto">No photo yet</div>';
  const tags = [];
  if (p.status === 'draft') tags.push('<span class="tag warn">Draft</span>');
  if (p.attention) tags.push('<span class="tag warn">Needs check</span>');
  if (p.language) tags.push(`<span class="tag">${esc(p.language)}</span>`);
  return `<div class="card" role="button" tabindex="0" data-i="${i}">
    <div class="photos">${imgs}</div>
    <div class="meta">
      <div class="pid">${esc(p.sku || p.barcode)}</div>
      <div class="name" dir="auto">${esc(p.title)}</div>
      <div class="sub" dir="auto">${esc(p.author || p.vendor || p.type)}</div>
      <div class="sub">${esc(p.barcode)} · ${p.photos.length} photo${p.photos.length === 1 ? '' : 's'}</div>
      ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}
    </div>
  </div>`;
}

function renderMore() {
  if (shown >= LIST.length) return;
  const next = LIST.slice(shown, shown + PAGE);
  grid.insertAdjacentHTML('beforeend', next.map(p => cardHTML(p, DATA.indexOf(p))).join(''));
  shown += next.length;
}

function apply() {
  const q = searchEl.value.trim().toLowerCase();
  LIST = DATA.filter(p => {
    if (filterKey === 'books' && p.type !== 'Books') return false;
    if (filterKey === 'stationery' && p.type === 'Books') return false;
    if (filterKey === 'attention' && !p.attention) return false;
    if (filterKey === 'nophoto' && p.photos.length) return false;
    return !q || p._s.includes(q);
  });
  grid.innerHTML = ''; shown = 0; renderMore();
  emptyEl.classList.toggle('hidden', LIST.length > 0);
  countEl.textContent = `Showing ${LIST.length.toLocaleString()} of ${DATA.length.toLocaleString()} products`;
}

function openDetail(p) {
  $('dtitle').textContent = p.title;
  $('dphotos').innerHTML = p.photos.length
    ? p.photos.map((ph, n) => `<a href="${esc(ph.full)}" target="_blank" rel="noopener" title="Open full-size photo"><img src="${esc(ph.full)}" loading="lazy" alt="${esc(p.title)} – photo ${n + 1}"></a>`).join('')
    : '<div class="nophoto">No photo yet</div>';
  $('dnote').innerHTML = p.attention ? `<div class="note">${esc(p.attention)}</div>` : '';
  const facts = [
    ['SKU', p.sku], ['Barcode', p.barcode], ['Author', p.author], ['Publisher / brand', p.vendor],
    ['Type', p.type], ['Price', p.price], ['Sheet title', p.sheet_title !== p.title ? p.sheet_title : ''],
    ['Match', p.match], ['Photo source', p.photo_source], ['Shopify status', p.status],
  ].filter(([, v]) => v);
  $('dfacts').innerHTML = facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd dir="auto">${esc(v)}</dd>`).join('');
  $('ddesc').innerHTML = p.description;
  $('dlg').showModal();
  $('dlg').scrollTop = 0;
}

grid.addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (c) openDetail(DATA[+c.dataset.i]);
});
grid.addEventListener('keydown', e => {
  const c = e.target.closest('.card');
  if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDetail(DATA[+c.dataset.i]); }
});
$('dclose').addEventListener('click', () => $('dlg').close());
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });
searchEl.addEventListener('input', apply);
document.querySelectorAll('.filters button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  filterKey = b.dataset.f; apply();
}));
new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) renderMore(); }, {rootMargin: '800px'}).observe($('sentinel'));

fetch('gallery_data.json').then(r => r.json()).then(data => {
  DATA = data.map(p => ({...p, _s: [p.title, p.sheet_title, p.author, p.sku, p.barcode, p.vendor].join(' ').toLowerCase()}));
  const photos = DATA.reduce((n, p) => n + p.photos.length, 0);
  $('lede').textContent = `${DATA.length.toLocaleString()} products · ${photos.toLocaleString()} photos. Tap a card for all photos and the description; swipe a card to flip through its photos.`;
  apply();
}).catch(() => { grid.innerHTML = '<div id="empty">Failed to load data.</div>'; });
</script>
</body>
</html>
